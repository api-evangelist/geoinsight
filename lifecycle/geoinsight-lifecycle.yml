name: GeoInsight API Lifecycle
description: >-
  GeoInsight publishes no versioning policy, no deprecation policy, no SLA and no status page. The only
  version signal anywhere is info.version in the OpenAPI, which is not reachable from any URL, header or
  media type, so a consumer has no way to pin a version or to be told one changed. The company's public
  web surface is three pages (home, terms, privacy) and there is no changelog, blog or release feed on any
  host.
versioning:
  scheme: none
  current: '3.0.0'
  source: 'openapi/geoinsight-ogc-api-dggs-openapi.yml info.version'
  in_path: false
  in_header: false
  in_media_type: false
  policy_url: null
  detail: >-
    No /v1 or /v3 path segment, no API-Version request or response header, no versioned media type. The
    contract's declared version 3.0.0 is not addressable by a client. Note the potential for confusion:
    OGC API - DGGS Part 1 is at version 1.0 and OpenAPI at 3.1.0, so a bare "3.0.0" is ambiguous even to a
    reader who finds it.
deprecation:

  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  detail: >-
    No operation in the contract carries deprecated: true, and no Sunset or Deprecation response header
    was observed. That is consistent with a young API rather than a stable one - there is no evidence of a
    deprecation practice either way. No Deprecation pointer is emitted.
sla:
  url: null

apis:
  - name: OGC API - DGGS
    description: >-
      Standards-compliant OGC API - Discrete Global Grid Systems endpoint exposing the GeoInsight Spatial Token
      store for zone-based queries. Fourteen read operations across four resource families: a landing page and
      service description, a collection catalogue (22 published collections), the DGGRS registry (H3, ISEA3H via
      both DGGRID and DGGAL, IGEO7, IVEA3H), zone discovery and zone data retrieval with relative-depth
      aggregation, and an OGC API - Features style /items surface backed by a GeoParquet lake with CQL2 filtering.
      Zone data requests accept COG raster statistics parameters (band, no-data, sampling factor, all-touched) and
      STAC search strategies (single, latest, mosaic) with cloud-cover and intersection thresholds. Reads answer
      anonymously at the time of probing; the official Python package documents a GeoInsight Personal Token (GPT)
      plus API Private Key (APK) issued from the dashboard.
    humanURL: https://api.geoinsight.ai/api?f=html

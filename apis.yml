name: GeoInsight
description: >-
  GeoInsight GmbH is a German geospatial-AI company running a Data-as-a-Service platform built on a Discrete Global
  Grid System (DGGS). It converts Earth-observation and vector data into AI-ready hierarchical hexagonal "Spatial
  Tokens" so that models can reason about geography the way language models reason about text. The platform is
  exposed through a standards-compliant OGC API - DGGS endpoint that answers zone-based queries across multiple
  DGGRS (H3, ISEA3H, IGEO7, IVEA3H), serving Sentinel-2 and Landsat imagery from the Copernicus and USGS archives,
  RADARSAT Constellation backscatter, Overture administrative boundaries, AIS vessel positions, building footprints
  and elevation models. Queries return GeoJSON, DGGS-JSON, GeoParquet or HTML, with CQL2 filtering, COG raster
  statistics and STAC search strategies. Target markets are OSINT and maritime intelligence, climate and
  environment, agriculture and food security, infrastructure and urban planning, disaster response, and finance
  and risk. The company is an NVIDIA Inception member and participates in the OGC AI-DGGS pilot programme.

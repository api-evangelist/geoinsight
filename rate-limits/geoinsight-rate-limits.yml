note: >-
  Recorded as limit_count 0 with evidence rather than omitted. Two observations make the absence
  consequential rather than merely undocumented. First, an unparameterised zone listing
  (/collections/overture_admin0/dggs/H3/zones) returned an nginx 502 rather than a 429 or a bounded
  result - the service failed under a request it had no mechanism to refuse. Second, the DGGS zone
  routes accept no limit or offset parameter at all, so a caller cannot voluntarily bound a zone query
  even if it wants to.

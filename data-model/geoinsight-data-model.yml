join_key:
  entity: ZoneData
  note: >-
    The zone identifier is the join key of the whole platform and the reason the company calls it a
    Spatial Token. Any two collections resolved onto the same DGGRS at the same zone id are directly
    joinable without reprojection or resampling - which is exactly what the live data_integration_res6 /
    data_integration_res8 (air quality) and data_interop_res6 / data_interop_res10 (hydrography)
    collections demonstrate: the same use case published at two grid resolutions.

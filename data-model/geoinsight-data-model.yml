  - name: Zone
    schema: ZoneIdResponse
    path: '/dggs/{dggrs_id}/zones/{zone_id}'
    identifier: id
    id_style: >-
      The DGGRS's own native zone identifier - an H3 cell index for H3, and the corresponding native index
      for ISEA3H/IGEO7/IVEA3H. Validated by the underlying grid library, which reports its own diagnostic
      in the error hint on a bad id.
    fields:
      [id, level, geometry, centroid, bbox, crs, shapeType, areaMetersSquare, volumeMetersCube,
       temporalInterval, temporalDurationSeconds, statistics, links]
  - name: ZoneStatistics
    schema: ValueItem

name: GeoInsight OGC API - DGGS Data Model
description: >-
  Entity graph derived from the 28 component schemas and the path hierarchy of the published OpenAPI, plus
  the live catalogue at https://api.geoinsight.ai/collections and the DGGRS registry at
  https://api.geoinsight.ai/dggs. The model has two axes that meet at Zone Data: a data axis
  (Collection -> Feature / GeoParquet lake) and a grid axis (DGGRS -> Zone). The product - a "Spatial
  Token" - is the intersection: one collection's values aggregated into one zone of one grid at one depth.
root: RootResponse
entities:
  - name: Root
    schema: RootResponse
    path: /
    description: Service landing page. Carries title, description, attribution and the links[] array that bootstraps discovery.
    fields: [links, title, description, attribution]
  - name: Collection
    schema: CollectionId
    path: '/collections/{collection_id}'
    identifier: id
    id_style: >-
      Opaque human-readable string. Observed families - Sentinel-2 scene ids
      (S2A_MSIL2A_20230909T185941_N0510_R013_T11UMU_20241104T170811), RADARSAT Constellation product ids
      with polarisation suffixes (RCM3_..._RL / _RR / _RRRL), COG filenames
      (OIS-Reech_A12426_011_PlanarRectified_cog) and curated slugs (ais, canada_dem, alberta_buildings,
      overture_admin0, overture_admin1, cubewerx_buildings, landsat_test1, data_integration_res6).
    fields: [id, title, description, links, item_type, attribution, crs, extent]
    live_count: 22
    live_evidence: 'https://api.geoinsight.ai/collections?f=json returned 22 collections on 2026-08-20'
  - name: Extent
    schema: Extent
    fields: [spatial, temporal]
    description: Bounding box and time interval of a collection.
  - name: Spatial
    schema: Spatial
    fields: [bbox, crs]
  - name: Temporal
    schema: Temporal
    fields: [interval, trs]
  - name: DGGRS
    schema: DggrsIdResponse
    path: '/dggs/{dggrs_id}'
    identifier: id
    id_style: 'Short uppercase registry name.'
    fields: [id, title, uri, description, crs, default_depth, max_refinement_level, max_relative_depth, links]
    live_members: [ISEA3HDGGRID, IGEO7, H3, ISEA3HDGGAL, IVEA3H]
    live_evidence: >-
      https://api.geoinsight.ai/dggs?f=json. GET /dggs/H3 returns default_depth 4,

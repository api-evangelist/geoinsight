openapi: 3.2.0
info:
  title: GeoInsight OGC API - DGGS Conformance API
  description: DGGS data retrieval per OGC 21-038r1. Admin endpoints (/admin/*) are localhost-only and intentionally undocumented here.
  license:
    name: ''
  version: 0.1.2
tags:
- name: Conformance
paths:
  /conformance:
    get:
      tags:
      - Conformance
      operationId: conformance_utoipa_doc
      responses:
        '200':
          description: Conformance declaration
        '503':
          description: Datastore not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Conformance utoipa doc
      x-summary-source: derived
components:
  schemas:
    ApiError:
      type: object
      description: API error response body for JSON error messages.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code
          example: 422
          minimum: 0
        hint:
          type:
          - string
          - 'null'
          description: Optional hint to help client fix the request
          example: Parameter `parent-zone-level` is required when `parent-zone` is provided
        message:
          type: string
          description: Fixed message describing the error
          example: Validation Failed
x-provenance:
  method: harvested
  publisher: GeoInsight
  source: https://api.geoinsight.ai/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)

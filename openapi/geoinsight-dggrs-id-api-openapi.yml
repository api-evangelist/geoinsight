        title:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
    DggrsIdResponse:
      type: object
      required:
      - id
      - title
      - uri
      properties:
        crs:
          type:
          - array
          - 'null'
          items:
            type: string
        default_depth:
          type:
          - integer
          - 'null'
          format: int32
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        max_refinement_level:
          type:
          - integer

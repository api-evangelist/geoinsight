servers:
- url: https://api.geoinsight.ai
  description: GeoInsight OGC API - DGGS production endpoint
tags:
- name: DGGRS ID
paths:
  /collections/{collection_id}/dggs/{dggrs_id}:
    get:
      tags:
      - DGGRS ID
      operationId: collection_id_dggrs_id_utoipa_doc
      parameters:
      - name: collection_id
        in: path
        description: Collection identifier
        required: true
        schema:
          type: string
      - name: dggrs_id
        in: path
        description: DGGRS_ID identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get collection_id DGGRS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DggrsIdResponse'
            text/html:
              schema:
                type: string
  /dggs/{dggrs_id}:
    get:
      tags:
      - DGGRS ID
      operationId: dggrs_id_utoipa_doc
      parameters:
      - name: dggrs_id
        in: path
        description: DGGRS_ID identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get DGGRS_ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DggrsIdResponse'
            text/html:
              schema:
                type: string

openapi: 3.2.0
info:
  title: GeoInsight OGC API - DGGS Orders API
  description: DGGS data retrieval per OGC 21-038r1. Admin endpoints (/admin/*) are localhost-only and intentionally undocumented here.
  license:
    name: ''
  version: 0.1.2
tags:
- name: Orders
paths:
  /orders:
    get:
      tags:
      - Orders
      operationId: orders_utoipa_doc
      responses:
        '200':
          description: List all orders
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Datastore not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Orders utoipa doc
      x-summary-source: derived
    post:
      tags:
      - Orders
      operationId: create_order_utoipa_doc
      responses:
        '200':
          description: Order created; processing jobs are spawned
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Create order utoipa doc
      x-summary-source: derived
  /orders/{order_id}:
    get:
      tags:
      - Orders
      operationId: order_id_utoipa_doc
      parameters:
      - name: order_id
        in: path
        description: Order identifier
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Order with its jobs
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Order id utoipa doc
      x-summary-source: derived
  /orders/{order_id}/jobs:
    get:
      tags:
      - Orders
      operationId: jobs_utoipa_doc
      parameters:
      - name: order_id
        in: path
        description: Order identifier
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Jobs of the order
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Jobs utoipa doc
      x-summary-source: derived
  /orders/{order_id}/jobs/{job_id}:
    get:
      tags:
      - Orders
      operationId: job_id_utoipa_doc
      parameters:
      - name: order_id
        in: path
        description: Order identifier
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: job_id
        in: path
        description: Job identifier
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Job status
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Job id utoipa doc
      x-summary-source: derived
components:
  schemas:
    ApiError:
      type: object
      description: API error response body for JSON error messages.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code
          example: 422
          minimum: 0
        hint:
          type:
          - string
          - 'null'
          description: Optional hint to help client fix the request
          example: Parameter `parent-zone-level` is required when `parent-zone` is provided
        message:
          type: string
          description: Fixed message describing the error
          example: Validation Failed
x-provenance:
  method: harvested
  publisher: GeoInsight
  source: https://api.geoinsight.ai/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)

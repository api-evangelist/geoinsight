blockers:
  - >-
      operationId is not unique in the source contract - 14 operations share 10 ids, with four ids used
      twice each. Any generated MCP server that keys tools on operationId will collide. The candidate tool
      names above were assigned from the path and method instead, which is why several tools cite the same
      operation_id.
  - >-
      No securityScheme in the contract, so a generated server has no credential to pass through even
      though the provider documents a GPT/APK pair.
  - >-
      No rate-limit signal, so a server has nothing to back off on.
pointer_policy:
  emit_mcpserver_pointer: false
  reason: >-
    No `type: MCPServer` pointer is wired into apis.yml for this provider. The MCPServer pointer asserts
    that the provider ships an MCP server, and GeoInsight does not - this file is a derived candidate, not
    a discovered surface. Emitting the pointer would award the mcp_server_present ergonomics check and the
    agent-readiness mcp_server dimension for something that does not exist. A `type: ToolCrosswalk`
    pointer IS wired, because the crosswalk records a real, verifiable property of the published contract
    (the operationId collisions that block automated tool binding).

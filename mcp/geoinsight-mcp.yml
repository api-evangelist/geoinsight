  - {url: 'https://mcp.geoinsight.ai/mcp', method: 'POST tools/list', status: 404}
  - {url: 'https://dggs.io/api/mcp', method: 'POST tools/list', status: 404}
  - {url: 'https://registry.npmjs.org/geoinsight', status: 404}

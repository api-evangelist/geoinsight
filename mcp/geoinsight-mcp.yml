name: GeoInsight MCP (candidate)
description: >-
  GeoInsight ships NO MCP server. This is a derived candidate tool set, computed from the 14 operations of
  the published OGC API - DGGS contract, offered as a starting point - not a claim that any of it is
  callable today. Every tool below names the operation it would wrap and the parameters that operation
  really declares.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    Nobody ships a server. Probed POST tools/list against https://api.geoinsight.ai/mcp (404),
    https://mcp.geoinsight.ai/mcp (404, nginx default backend behind a fake ingress certificate) and
    https://dggs.io/api/mcp (404). No npm or PyPI MCP package exists under any geoinsight name and there
    is no public GitHub organization. auth is unknown rather than none because the provider documents a
    GPT/APK credential pair whose wire format is unpublished, even though reads currently answer
    anonymously.
probes:

finding: >-
  8 of 14 candidate tools cannot be bound by operationId because the id is ambiguous. Any automated
  OpenAPI-to-MCP generator run against this contract as published will either collide on those ids or drop
  half the surface silently. Making operationId unique is a generator-configuration change on GeoInsight's
  side and is the single highest-leverage fix for agent consumption of this API.
